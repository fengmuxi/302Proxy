version: '3.8'

# ============================================
# 服务器端部署配置
# 放置在服务器 /opt/302_proxy/ 目录下
# ============================================

services:
  302-proxy:
    image: registry.cn-hangzhou.aliyuncs.com/fengmuxi-docker-images/302_proxy:latest
    container_name: 302-proxy
    restart: unless-stopped
    ports:
      - "18686:18686"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./log:/app/log
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
