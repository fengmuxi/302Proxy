# ============================================================================
# nginx302_proxy 前置反代配置（修正版）
# 适用：将 nginx302_proxy（Python aiohttp）放在 nginx 之后做反向代理。
# 关键约束（改动前务必理解，详见 .workbuddy/memory/MEMORY.md 部署约束段）：
#
# 1) 【禁止开启 proxy_cache】
#    签名握手响应（302/200）初始请求通常不带 Range 头，proxy_no_cache 兜不住，
#    会把「每客户端专属的 _st+_sig+_ip 签名链接」缓存并错发给别的客户端 → 403 / 签名泄露。
#    应用自身已按上游能力精确下发 Accept-Ranges / Content-Range / Cache-Control，
#    切勿用 add_header Cache-Control immutable 等覆盖。
#
# 2) 【Host 必须用 $host 透传】
#    签名 base_url 回退 = cfg.base_url or f"{scheme}://{原始Host头}"
#    （见 proxy_core.py:593-594，用的是原始 Host，不是 X-Original-Host）。
#    若写 Host 127.0.0.1 会把签名链打成 http://127.0.0.1/_signed/...，播放器拿不到。
#    要么 Host $host，要么后台「对外基础地址」(base_url) 显式配成公网 HTTPS。
#
# 3) 【真实客户端 IP】
#    应用 extract_client_ip 仅在 trust_forward_headers=True（默认）且来源 IP 落在
#    trusted_proxy_networks 时才解析 X-Forwarded-For（从右往左取首个不可信地址，防伪造）。
#    需把本 nginx 的 IP（本机反代填 127.0.0.1/32）加入 trusted_proxy_networks，
#    否则 IP 绑定(_ip 盲化令牌)/封禁/地区过滤会误判为 127.0.0.1。
#    trust_upstream_ip_headers 保持 False（不轻信可伪造的 X-Real-IP）。
#
# 4) A 模式（redirect_return 不跟随型）媒体直连 CDN，nginx 只代理 tiny 握手，
#    下面流式优化对媒体基本无感；B 模式（proxy_stream 本地代理）媒体真流过本机，才需要。
# ============================================================================

# 可选：仅当后台确实用 websocket 时才需要下面这段 map；
# 否则不要发 Upgrade/Connection $connection_upgrade（空 Connection 头可能出问题）。
# map $http_upgrade $connection_upgrade {
#     default "";
#     "websocket" "upgrade";
# }

location / {
    # —— 反代目标：改成你实际监听的地址/端口 ——
    proxy_pass http://127.0.0.1:你的端口;

    # —— 透传真实公网 Host：签名 base_url 回退依赖原始 Host 头（见约束 2）——
    proxy_set_header Host $host;

    # —— 真实客户端 IP（约束 3）——
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # —— 流式透传（B 模式本地代理需要）——
    proxy_http_version 1.1;
    proxy_buffering off;               # 即时透传，且本身禁用缓存
    proxy_request_buffering off;
    proxy_set_header Range $http_range;        # 关键：Range 端到端生效
    proxy_set_header If-Range $http_if_range;

    # —— 长视频会话超时 ——
    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # —— 性能 ——
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    client_max_body_size 0;

    # —— 客户端断开即中止上游拉流（默认 off，对代理到本机应用是期望行为，勿改 on）——
    proxy_ignore_client_abort off;

    # —— 仅在确有多个上游时才重试；不带 timeout，避免慢速媒体被中途重头下载 ——
    proxy_next_upstream error http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # 可选：告知下游代理不要缓冲（无害）
    # add_header X-Accel-Buffering no;
}
