<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>确认封禁IP</title>
  <style>
    :root {
      --color-paper: #ffffff;
      --color-ink: #0f172a;
      --color-muted: #64748b;
      --color-warning: #f59e0b;
      --color-warning-bg: #fef3c7;
      --color-success: #10b981;
      --color-success-bg: #d1fae5;
      --color-error: #dc2626;
      --color-error-bg: #fee2e2;
      --color-accent: #2563eb;
      --color-accent-bg: #dbeafe;
      --radius-md: 8px;
      --radius-lg: 12px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 32px;
      --space-xl: 64px;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-xl: 24px;
      --text-2xl: 32px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 150ms;
      --dur-normal: 250ms;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --color-paper: #0f172a;
        --color-ink: #f1f5f9;
        --color-muted: #94a3b8;
        --color-warning-bg: rgba(120, 53, 15, 0.3);
        --color-success-bg: rgba(6, 78, 59, 0.3);
        --color-error-bg: rgba(127, 29, 29, 0.3);
        --color-accent-bg: rgba(30, 58, 138, 0.3);
      }
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: var(--space-xl) var(--space-lg);
    }
    
    .icon-warning {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--space-md);
      background: var(--color-warning-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .icon-warning svg {
      width: 32px;
      height: 32px;
      color: var(--color-warning);
    }
    
    .title {
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-sm);
      color: var(--color-ink);
    }
    
    .message {
      font-size: var(--text-base);
      color: var(--color-muted);
      margin-bottom: var(--space-lg);
    }
    
    .info-box {
      background: var(--color-accent-bg);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
      text-align: left;
    }
    
    .info-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-accent);
      margin-bottom: var(--space-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .info-value {
      font-size: var(--text-sm);
      color: var(--color-ink);
      word-break: break-word;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: 12px var(--space-md);
      font-size: var(--text-sm);
      font-weight: 500;
      font-family: inherit;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: 
        background-color var(--dur-fast) var(--ease-out),
        color var(--dur-fast) var(--ease-out),
        border-color var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out);
      text-decoration: none;
    }
    
    .btn-danger {
      background: var(--color-error);
      color: #ffffff;
    }
    
    .btn-danger:hover {
      background: #b91c1c;
    }
    
    .btn-danger:active {
      transform: translateY(1px);
    }
    
    .btn-secondary {
      background: transparent;
      color: var(--color-muted);
      border-color: var(--color-muted);
    }
    
    .btn-secondary:hover {
      color: var(--color-ink);
      border-color: var(--color-ink);
    }
    
    .btn-secondary:active {
      transform: translateY(1px);
    }
    
    .success-box {
      background: var(--color-success-bg);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    
    .success-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-md);
      background: var(--color-success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .success-icon svg {
      width: 24px;
      height: 24px;
      color: #ffffff;
    }
    
    .success-title {
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--color-ink);
      margin-bottom: var(--space-xs);
    }
    
    .success-message {
      font-size: var(--text-sm);
      color: var(--color-muted);
    }
    
    .error-box {
      background: var(--color-error-bg);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    
    .error-title {
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--color-error);
      margin-bottom: var(--space-xs);
    }
    
    .error-message {
      font-size: var(--text-sm);
      color: var(--color-muted);
    }
    
    .footer {
      margin-top: var(--space-xl);
      font-size: var(--text-xs);
      color: var(--color-muted);
    }
    
    @media (max-width: 480px) {
      .card {
        padding: var(--space-lg) var(--space-md);
      }
      
      .title {
        font-size: var(--text-lg);
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      
      .btn:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <!-- 初始状态：确认页面 -->
    <div id="confirm-view">
      <div class="icon-warning">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      
      <h1 class="title">确认封禁IP地址</h1>
      <p class="message">点击下方按钮将封禁此IP地址的访问权限。</p>
      
      <div class="info-box">
        <div class="info-label">IP地址</div>
        <div class="info-value" id="ip-display">加载中...</div>
      </div>
      
      <div class="info-box" style="background: var(--color-warning-bg);">
        <div class="info-label" style="color: var(--color-warning);">异常原因</div>
        <div class="info-value" id="reason-display">-</div>
      </div>
      
      <div class="actions">
        <button class="btn btn-danger" id="confirm-btn" onclick="confirmBlock()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          确认封禁
        </button>
        <a href="javascript:history.back()" class="btn btn-secondary">返回</a>
      </div>
    </div>
    
    <!-- 成功状态 -->
    <div id="success-view" style="display: none;">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"></path>
        </svg>
      </div>
      
      <h1 class="success-title">封禁成功</h1>
      <p class="success-message">IP地址已被成功封禁，该IP将无法访问代理服务。</p>
      
      <div class="actions" style="margin-top: 32px;">
        <a href="javascript:history.back()" class="btn btn-secondary">返回</a>
      </div>
    </div>
    
    <!-- 错误状态 -->
    <div id="error-view" style="display: none;">
      <div class="error-box">
        <h1 class="error-title" id="error-title">链接无效</h1>
        <p class="error-message" id="error-message">此链接已过期或已被使用。</p>
      </div>
    </div>
    
    <footer class="footer">
      <p>此链接30分钟内有效，仅可使用一次</p>
    </footer>
  </article>
  
  <script>
    var token = window.location.pathname.split('/').pop();
    var ipDisplay = document.getElementById('ip-display');
    var reasonDisplay = document.getElementById('reason-display');
    var confirmView = document.getElementById('confirm-view');
    var successView = document.getElementById('success-view');
    var errorView = document.getElementById('error-view');
    var confirmBtn = document.getElementById('confirm-btn');
    
    // 验证token并获取IP信息
    fetch('/_block/' + token + '/info', {
      method: 'GET',
      headers: {'Content-Type': 'application/json'}
    })
    .then(function(resp) { return resp.json(); })
    .then(function(data) {
      if (data.ok) {
        ipDisplay.textContent = data.ip;
        reasonDisplay.textContent = data.reason || '未知';
      } else {
        showError('链接无效', data.error || '此链接已过期或已被使用');
      }
    })
    .catch(function() {
      showError('验证失败', '无法验证链接有效性，请稍后重试');
    });
    
    function confirmBlock() {
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>处理中...';
      
      fetch('/_block/' + token + '/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'}
      })
      .then(function(resp) { return resp.json(); })
      .then(function(data) {
        if (data.ok) {
          confirmView.style.display = 'none';
          successView.style.display = 'block';
        } else {
          showError('封禁失败', data.error || '操作失败，请稍后重试');
        }
      })
      .catch(function() {
        showError('请求失败', '网络错误，请稍后重试');
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>确认封禁';
      });
    }
    
    function showError(title, message) {
      confirmView.style.display = 'none';
      successView.style.display = 'none';
      errorView.style.display = 'block';
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-message').textContent = message;
    }
  </script>
</body>
</html>
