<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - 服务异常</title>
  <style>
    /* Hallmark · component: 500-error-page · genre: modern-minimal · theme: catalog
     * states: default · hover · focus · active
     * contrast: pass (46–50)
     */

    :root {
      --color-paper: #ffffff;
      --color-ink: #0f172a;
      --color-muted: #64748b;
      --color-warning: #d97706;
      --color-warning-bg: #fef3c7;
      --color-warning-border: #fde68a;
      --color-accent: #2563eb;
      --color-accent-bg: #dbeafe;
      --radius-md: 8px;
      --radius-lg: 12px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 32px;
      --space-xl: 64px;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 20px;
      --text-xl: 24px;
      --text-4xl: 48px;
      --text-6xl: 72px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 150ms;
      --dur-normal: 250ms;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-paper: #0f172a;
        --color-ink: #f1f5f9;
        --color-muted: #94a3b8;
        --color-warning-bg: rgba(120, 53, 15, 0.3);
        --color-warning-border: rgba(180, 83, 9, 0.5);
        --color-accent-bg: rgba(30, 58, 138, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      overflow-x: clip;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .error-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: var(--space-xl) var(--space-lg);
    }

    .error-code {
      font-size: var(--text-6xl);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--color-warning);
      margin-bottom: var(--space-md);
    }

    .error-title {
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-sm);
      color: var(--color-ink);
    }

    .error-message {
      font-size: var(--text-base);
      color: var(--color-muted);
      margin-bottom: var(--space-lg);
    }

    .error-reason {
      background: var(--color-warning-bg);
      border: 1px solid var(--color-warning-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
      text-align: left;
    }

    .error-reason-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-warning);
      margin-bottom: var(--space-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .error-reason-text {
      font-size: var(--text-sm);
      color: var(--color-ink);
      word-break: break-word;
    }

    .error-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--text-sm);
      font-weight: 500;
      font-family: inherit;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition:
        background-color var(--dur-fast) var(--ease-out),
        color var(--dur-fast) var(--ease-out),
        border-color var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #ffffff;
    }

    .btn-primary:hover,
    .btn-primary.is-hover {
      background: #1d4ed8;
    }

    .btn-primary:focus-visible,
    .btn-primary.is-focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .btn-primary:active,
    .btn-primary.is-active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-muted);
      border-color: var(--color-muted);
    }

    .btn-secondary:hover,
    .btn-secondary.is-hover {
      color: var(--color-ink);
      border-color: var(--color-ink);
    }

    .btn-secondary:focus-visible,
    .btn-secondary.is-focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .btn-secondary:active,
    .btn-secondary.is-active {
      transform: translateY(1px);
    }

    .error-footer {
      margin-top: var(--space-xl);
      font-size: var(--text-xs);
      color: var(--color-muted);
    }

    .error-footer a {
      color: var(--color-accent);
      text-decoration: none;
    }

    .error-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .error-card {
        padding: var(--space-lg) var(--space-md);
      }

      .error-code {
        font-size: var(--text-4xl);
      }

      .error-title {
        font-size: var(--text-lg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .btn:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <article class="error-card" role="alert" aria-live="polite">
    <div class="error-code" aria-label="错误代码 500">500</div>

    <h1 class="error-title">服务异常</h1>

    <p class="error-message">
      代理服务在处理请求时遇到问题，可能是上游服务异常、请求超时或重定向次数超限。
    </p>

    <aside class="error-reason" id="error-reason-container" hidden>
      <div class="error-reason-label">异常类型</div>
      <div class="error-reason-text" id="error-reason-text">-</div>
    </aside>

    <!-- <div class="error-actions">
      <button type="button" class="btn btn-primary" onclick="window.location.reload()">重试请求</button>
      <a href="/" class="btn btn-secondary">返回首页</a>
    </div> -->

    <footer class="error-footer">
      <p>
        如问题持续存在，请联系
        <a href="#" id="admin-email">系统管理员</a>
      </p>
    </footer>
  </article>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var reason = params.get('reason');

      if (reason) {
        try {
          reason = decodeURIComponent(reason);
        } catch (e) {}

        var reasonContainer = document.getElementById('error-reason-container');
        var reasonText = document.getElementById('error-reason-text');

        if (reasonContainer && reasonText) {
          reasonText.textContent = reason;
          reasonContainer.hidden = false;
        }
      }

      var adminEmail = params.get('admin');
      if (adminEmail) {
        var emailLink = document.getElementById('admin-email');
        if (emailLink) {
          emailLink.href = 'mailto:' + adminEmail;
        }
      }
    })();
  </script>
</body>
</html>
